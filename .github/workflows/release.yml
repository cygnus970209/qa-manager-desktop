# 태그(v*) 푸시 시 macOS(universal) · Windows · Linux 번들을 빌드해 GitHub Release 초안에 첨부하고,
# 4개 빌드가 모두 성공하면 초안을 자동 게시한다 (publish 잡). 하나라도 실패하면 초안으로 남아 확인할 수 있다.
# 태그에 '-' 가 있으면(예: v0.2.0-beta.1) pre-release 로 게시하고 latest 로 표시하지 않는다.
# macOS: Developer ID Application 서명 + Apple ID 방식 공증(notarization). 아래 APPLE_* 시크릿이 필요하다.
# Windows: 미서명 (SmartScreen 경고 → "추가 정보 > 실행"). 외부 배포 시 Azure Artifact Signing 도입 예정.
# Linux: 서명 불필요.
name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 는 유니버설(arm64 + x86_64) 단일 번들 — 사용자가 칩 종류를 고를 필요가 없고 Rosetta 안내도 뜨지 않는다
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci || npm install

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 서명·공증. Tauri CLI 가 이 변수들을 읽어 임시 키체인에 인증서를 넣고
          # 서명(hardened runtime) → 공증 → 스테이플까지 처리한다. macOS 외 러너에서는 무시된다.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QA Manager ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}

      # Tauri 는 .app 만 공증하고 .dmg 는 서명만 한다. 서명만 된 dmg 는 열 때 Gatekeeper 경고가 뜨므로
      # dmg 도 공증·스테이플한 뒤 Release 자산을 교체한다. (GitHub 은 자산 이름의 공백을 '.' 으로 바꾼다)
      - name: Notarize & staple DMG
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in src-tauri/target/*/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/dmg/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            asset="$(basename "$dmg" | tr ' ' '.')"
            gh release delete-asset "$TAG" "$asset" -y || true
            gh release upload "$TAG" "$dmg"
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish draft release
        run: |
          set -euo pipefail
          # 릴리즈 노트가 비어 있으면 GitHub 자동 생성 노트(이전 태그와의 비교 링크 포함)로 채운다
          body="$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)"
          if [ -z "$body" ]; then
            gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > notes.md
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          fi
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
          echo "published: https://github.com/$REPO/releases/tag/$TAG"
