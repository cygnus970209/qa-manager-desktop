# 태그(v*) 푸시 시 macOS(arm64/x64) · Windows · Linux 번들을 빌드해 GitHub Release 초안에 첨부한다.
# macOS: Developer ID Application 서명 + Apple ID 방식 공증(notarization). 아래 APPLE_* 시크릿이 필요하다.
# Windows: 미서명 (SmartScreen 경고 → "추가 정보 > 실행"). 외부 배포 시 Azure Artifact Signing 도입 예정.
# Linux: 서명 불필요.
name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci || npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 서명·공증. Tauri CLI 가 이 변수들을 읽어 임시 키체인에 인증서를 넣고
          # 서명(hardened runtime) → 공증 → 스테이플까지 처리한다. macOS 외 러너에서는 무시된다.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'QA Manager ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}
