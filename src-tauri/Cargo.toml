[package]
name = "qa-manager-desktop"
version = "0.1.2"
description = "QA Manager desktop shell"
edition = "2021"

[lib]
name = "qa_manager_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 알림 권한 안내 다이얼로그 / 시스템 설정 열기
tauri-plugin-dialog = "2"
open = "5"
# RUST_LOG=debug 로 실행하면 알림 라이브러리 내부 로그가 보인다 (진단용, 평소엔 무음)
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

# 네이티브 알림 + 클릭 응답 (Tauri 알림 플러그인은 데스크톱에서 클릭 이벤트를 제공하지 않아 직접 사용)
# Windows/Linux: notify-rust. macOS: 최신 UNUserNotificationCenter(mac-usernotifications) —
#   구형 NSUserNotificationCenter 는 macOS 26 에서 시스템에 접수조차 되지 않았다.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3"
